name: DCL Observatory Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/receipt_example.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "examples/receipt_example.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Python runtime and React observatory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test existing Python runtime
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install observatory dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Test scoring parity and render actual React app
        working-directory: site
        run: npm test
      - name: Build production React site
        working-directory: site
        run: npm run build
      - name: Upload Pages build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy DCL Observatory
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://michaelwave369.github.io/DCL/
    concurrency:
      group: dcl-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
